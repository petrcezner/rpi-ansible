- name: Install Miniconda3, Docker, and Docker Compose V2 on Raspberry Pi4
  hosts: serv
  become: true
  vars:
    pkgstoinstall: [ libffi-dev, libssl-dev, python3, python3-pip ]
    vm_remote_home: /home/petr
    vm_remote_user: petr
  tasks:
    - name: Apt update
      apt:
        update_cache: true
        upgrade: yes
      changed_when: false

    - name: Check if Docker is installed
      command: docker --version
      register: docker_installed
      failed_when: false
      changed_when: false

    - name: Install a list of packages
      apt:
        name: "{{ pkgstoinstall }}"
        update_cache: yes
      when: docker_installed.rc != 0

    - name: Remove python-configparser package
      apt:
        name: python-configparser
        state: absent
      when: docker_installed.rc != 0

    - name: Get Docker convenience script
      shell: curl -fsSL https://get.docker.com -o get-docker.sh
      args:
        creates: /home/{{ vm_remote_user }}/get-docker.sh
      when: docker_installed.rc != 0

    - name: Install Docker
      shell: sh /home/{{ vm_remote_user }}/get-docker.sh
      args:
        creates: /usr/bin/docker
      when: docker_installed.rc != 0

    - name: Make pi user execute docker commands
      shell: usermod -aG docker {{ vm_remote_user }}
      when: docker_installed.rc != 0

    - name: Install Docker Compose V2
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.11.2/docker-compose-linux-armv7
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      when: docker_installed.rc != 0

    - name: Remove the Docker installer
      file:
        state: absent
        path: "{{ vm_remote_home }}/get-docker.sh"
      when: docker_installed.rc != 0

    - name: Check if Miniconda is installed
      stat:
        path: "{{ vm_remote_home }}/miniconda3/bin/conda"
      register: conda_installed

    - name: Install Miniconda3 - download
      get_url:
        url: https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-aarch64.sh
        dest: /tmp/Miniconda3.sh
        mode: '0755'
      register: miniconda_script
      when: conda_installed.stat.exists == false

    - name: Install Miniconda3 - run installer
      shell: bash /tmp/Miniconda3.sh -b -p "{{ vm_remote_home }}/miniconda3"
      args:
        creates: "{{ vm_remote_home }}/miniconda3"
      when: conda_installed.stat.exists == false

    - name: Remove the Miniconda3 installer
      file:
        state: absent
        path: /tmp/Miniconda3.sh
      when: conda_installed.stat.exists == false

    - name: Add miniconda config to .bashrc
      lineinfile:
        path: "{{vm_remote_home }}/.bashrc"
        line: ". ~/miniconda3/etc/profile.d/conda.sh"
      when: conda_installed.stat.exists == false

    - name: Add conda activate to .bashrc
      lineinfile:
        path: "{{vm_remote_home }}/.bashrc"
        line: "conda activate"
      when: conda_installed.stat.exists == false

    - name: Reload .bashrc to update environment variables
      shell: source {{ vm_remote_home }}/.bashrc
      args:
        executable: /bin/bash

    - name: Remove MicroK8s if installed
      shell: snap remove microk8s

    - name: Remove MicroK8s if installed
      shell: snap remove microk8s

    - name: Check if MicroK8s is installed
      command: microk8s.status
      register: microk8s_installed
      failed_when: false
      changed_when: false

    - name: Check if MicroK8s system tweaks were performed
      stat:
        path: /boot/firmware/cmdline.txt
      register: cmdline_txt

    - name: Check if MicroK8s system tweaks line exists
      command: grep -q 'cgroup_enable=memory cgroup_memory=1 swapaccount=1/' /boot/firmware/cmdline.txt
      register: tweaks_performed
      failed_when: false
      changed_when: false
      when: cmdline_txt.stat.exists

    - name: Install snapd
      apt:
        name: snapd
        state: present
      when: microk8s_installed.rc != 0

    - name: Install core
      become: yes
      shell: snap install core
      when: microk8s_installed.rc != 0

    - name: MicroK8s system tweaks
      become: yes
      shell: "sed -i '$ s/$/ cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1 swapaccount=1/' /boot/firmware/cmdline.txt"
      when: microk8s_installed.rc != 0 and tweaks_performed.rc != 0

    - name: Reboot of the system
      reboot:
        reboot_timeout: 3600
      when: microk8s_installed.rc != 0 and tweaks_performed.rc != 0

    - name: Install MicroK8s
      shell: snap install microk8s --classic --channel=1.30
      when: microk8s_installed.rc != 0

    - name: Ensure MicroK8s is in PATH
      shell: 'export PATH=$PATH:/snap/bin'
      when: microk8s_installed.rc == 0

    - name: Reload .bashrc to update environment variables
      shell: source {{ vm_remote_home }}/.bashrc
      args:
        executable: /bin/bash

    - name: Add MicroK8s to the user
      shell: usermod -a -G microk8s {{ vm_remote_user }}
      when: microk8s_installed.rc != 0

    - name: Create .kube folder in the root
      file:
        path: ~/.kube
        state: directory
        mode: '0755'
      when: microk8s_installed.rc != 0

    - name: Create /etc/docker/daemon.json with insecure registries
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
              "insecure-registries" : ["localhost:32000"]
          }
      become: true
      when: microk8s_installed.rc != 0

    - name: Restart Docker service
      service:
        name: docker
        state: restarted
      become: true
      when: microk8s_installed.rc != 0

    - name: Add MicroK8s to the user
      shell: chown -f -R {{ vm_remote_user }} ~/.kube
      when: microk8s_installed.rc != 0

    - name: Check of MicroK8s services
      shell: snap list | grep microk8s
      when: microk8s_installed.rc != 0

    - name: Register microk8s as a bash command
      file:
        src: /snap/bin/microk8s
        dest: /usr/local/bin/microk8s
        state: link
      when: microk8s_installed.rc != 0

    - name: Enable MicroK8s services
      shell: microk8s enable dns hostpath-storage dashboard
      environment:
        PATH: "/snap/bin:{{ ansible_env.PATH }}"
      when: microk8s_installed.rc != 0

    - name: Reboot of the system
      reboot:
        reboot_timeout: 3600
